
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DailyTrack | To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 1. HEADER SECTION -->
    <header>
        <h1>DailyTrack</h1>
        <p>Stay Organized. Stay Productive.</p>

        <button type="button" id="themeToggle">
            Toggle Theme
        </button>
    </header>


    <main>

        <!-- 2. TASK INPUT SECTION -->
        <section id="taskInputSection">

            <h2>Add Your Task</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button type="button" id="addTask">
                Add Task
            </button>

        </section>


        <!-- 3. TASK STATISTICS SECTION -->
        <section id="statisticsSection">

            <h2>Task Statistics</h2>

            <div>
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div>
                <h3>Completed Tasks</h3>
                <p id="completedTasks">0</p>
            </div>

            <div>
                <h3>Pending Tasks</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>


        <!-- 4. FILTER SECTION -->
        <section id="filterSection">

            <h2>Filter Tasks</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >

            <button type="button" id="allTasks">
                All Tasks
            </button>

            <button type="button" id="pendingTasksFilter">
                Pending
            </button>

            <button type="button" id="completedTasksFilter">
                Completed
            </button>

        </section>


        <!-- 5. TASK LIST SECTION -->
        <section id="taskListSection">

            <h2>My Tasks</h2>

            <ul id="taskList">
                <!-- JavaScript will add tasks here -->
            </ul>

        </section>


        <!-- 6. EMPTY STATE SECTION -->
        <section id="emptyState">

            <p>No tasks yet! Add your first task.</p>

        </section>

    </main>


    <!-- 7. FOOTER SECTION -->
    <footer>

        <p>Made with ❤️</p>

        <h3>DailyTrack</h3>

        <p>Stay productive!</p>

    </footer>


    <!-- JAVASCRIPT FILE -->
    <script src="script.js"></script>

</body>
</html>
